[package]
name = "localci"
version = "0.1.0"
edition = "2024"
description = "Run GitHub Actions pipelines locally from a normalized DAG."
license = "MIT"
readme = "README.md"
repository = "https://github.com/MakFly/localci"
keywords = ["ci", "github-actions", "docker", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
clap = { version = "4.5.53", features = ["derive", "env"] }
dirs = "6.0.0"
futures = "0.3.31"
glob = "0.3.3"
ignore = "0.4.25"
indexmap = { version = "2.12.1", features = ["serde"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.23.0"
