name: Node Demo CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          key: npm-${{ runner.os }}
          path: node_modules
      - run: npm install
      - run: npm run lint

  tests:
    needs: lint
    runs-on: ubuntu-latest
    container: node:${{ matrix.node }}
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          key: npm-${{ runner.os }}-${{ matrix.node }}
          path: node_modules
      - run: npm install
      - run: npm test

  package:
    needs: tests
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dist
          node src/cli.js Ada > dist/greeting.txt
      - uses: actions/upload-artifact@v4
        with:
          name: node-greeting
          path: dist/greeting.txt

  verify-artifact:
    needs: package
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-greeting
          path: output
      - run: grep "Hello Ada from Node localci" output/dist/greeting.txt
